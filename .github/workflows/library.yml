name: Validate and publish library
on:
  push:
    branches: [main]
    paths: ['books/**', 'tools/**', '.github/workflows/library.yml']
  pull_request:
    paths: ['books/**', 'tools/**', 'reader-index.json']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: library-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tools -p 'test_*.py'
      - run: python tools/catalogue.py --write
  publish:
    if: github.event_name != 'pull_request'
    needs: validate
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/catalogue.py --write
      - name: Publish the validated catalog
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reader-index.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publish validated library catalog [skip ci]'
            git push
          fi
